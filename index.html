<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🎁 생일 선물이 도착했어요</title>
  <meta name="description" content="진짜 뽑으면 진짜 줌! 30칸 중 꽝은 딱 1칸, 당첨 확률 97%. 지금 바로 선물 상자를 열어보세요.">
  <!-- 카카오톡 등 미리보기용. og:image 는 절대 주소여야 함 (저장소 이름 바뀌면 같이 수정) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hyung-rae.github.io/birthday-gift/">
  <meta property="og:title" content="🎁 생일 선물이 도착했어요">
  <meta property="og:description" content="진짜 뽑으면 진짜 줌! 30칸 중 꽝은 딱 1칸, 당첨 확률 97%. 지금 바로 열어보세요.">
  <meta property="og:image" content="https://hyung-rae.github.io/birthday-gift/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#FFE4EF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <div id="intro" class="intro" role="button" tabindex="0" aria-label="선물 상자 열기">
    <div class="beams" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <p class="intro-to"><b data-to></b>님께<br>(아마도) 선물이 도착했어요</p>
    <div class="gift" aria-hidden="true">🎁</div>
    <p class="intro-hint">기대는 하지 말고 눌러보세요</p>
  </div>

  <div id="stage" class="stage" aria-hidden="true">
    <div class="rays"></div>
    <div class="orbit o1"><i></i><i></i><i></i><i></i></div>
    <div class="orbit o2"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="orbit o3"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="stage-cake">🎂</div>
    <p class="spell" id="spell"></p>
    <p class="spell-name" data-to></p>
    <p class="spell-roast">근데 선물은 없어 ^^</p>
  </div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <main class="page">
    <section id="gacha" class="card">
      <h2>🎰 <span data-to></span> 전용 생일 뽑기</h2>
      <p class="sub">카드 전부 까서 보여줄게. 거짓 없음 🙆<br>섞고 나서 딱 한 칸만 골라!</p>
      <div class="promise">
        <b>🎁 진짜 뽑으면 진짜 줌 🎁</b>
        <span>장난 아님 · 내가 직접 보증함 🤝</span>
      </div>
      <p id="odds" class="odds"></p>
      <ul id="prizeList" class="prize-list"></ul>
      <div id="board" class="board"></div>
      <p id="tease" class="tease" hidden></p>
      <div class="row">
        <button id="startBtn" class="btn">뽑기 시작하기 🎲</button>
        <button id="retryBtn" class="btn btn-ghost" hidden></button>
        <button id="letterBtn" class="btn" hidden>💌 편지 다시 보기</button>
      </div>
    </section>

    <footer class="ending">
      <p class="big">🎈 <span data-to></span> 생일 축하해 🎈<br><small>밥은 네가 사는 걸로 🙂</small></p>
      <button id="shareBtn" class="btn">링크 공유하기</button>
    </footer>
  </main>

  <div id="result" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rName">
      <p class="r-rank" id="rRank"></p>
      <div class="r-emoji" id="rEmoji"></div>
      <p class="r-name" id="rName"></p>
      <p class="r-desc" id="rDesc"></p>
      <button class="btn" id="closeBtn">확인</button>
    </div>
  </div>

  <!-- 마지막 회차가 끝나야 열리는 편지 -->
  <div id="letterModal" class="modal" hidden>
    <div class="modal-card letter" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <h2 id="letterTitle">💌 편지</h2>
      <p id="letter" class="letter-body"></p>
      <p class="sign">from. <span data-from></span></p>
      <button class="btn" id="letterClose">닫기</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
